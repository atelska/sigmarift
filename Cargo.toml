[package]
name = "sigmarift"
version = "0.1.0"
edition = "2024"
description = "Portable terminal application for local LLM-driven system operations"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-markdown = { version = "0.3.9", default-features = false }
tui-textarea-2 = "0.13"
unicode-width = "0.2"
